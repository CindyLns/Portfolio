<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        title: ['Playfair Display', 'serif'],
                        corps: ['Quicksand', 'sans-serif'],
                    },
                },
            }
        }
    </script>
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.3.0/css/all.min.css" integrity="sha512-SzlrxWUlpfuzQ+pcUCosxcglQRNAq/DZjVsC0lE40xsADsfeQoEypE+enwcOiGjk/bSuGGKHEyjSoQ1zVisanQ==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap" rel="stylesheet">
    <title>À propos Cindy Lionis</title>
</head>
<body class="font-corps">
    <header>
            <div class="relative flex items-center justify-between py-8 px-4 md:px-8 lg:px-[6.5rem]">
                 <a href="index.html">
                    <img src="assets/logocl.svg" class="h-12 w-12 md:h-16 md:w-16" alt="Cindy Lionis logo"/>
                </a>
                <button type="button" class="menu-icon relative h-10 w-10 rounded-md md:hidden" aria-expanded="false" aria-controls="main-menu" aria-label="Ouvrir le menu" data-menu-button>
                    <span class="absolute left-2 right-2 top-1/2 h-0.5 -translate-y-1/2 rounded-full bg-[#1a1b1f] transition-transform duration-300"></span>
                    <span class="absolute left-2 right-2 top-1/2 h-0.5 -translate-y-1/2 rounded-full bg-[#1a1b1f] transition-opacity duration-300"></span>
                    <span class="absolute left-2 right-2 top-1/2 h-0.5 -translate-y-1/2 rounded-full bg-[#1a1b1f] transition-transform duration-300"></span>
                </button>
                <nav id="main-menu" class="absolute left-4 right-4 top-full z-10 hidden rounded-2xl bg-white p-4 shadow-lg md:static md:block md:bg-transparent md:p-0 md:shadow-none">
                    <ul class="flex flex-col gap-4 text-lg font-semibold md:flex-row md:gap-6 lg:m-0">
                        <li>
                            <a href="about.html">À propos</a>
                        </li>
                        <li>
                            <a href="projects.html">Projets</a>
                        </li>
                        <li>
                            <a href="contact.html">Contact</a>
                        </li>
                    </ul>
                </nav>
            </div>

    </header>
    <main class="my-8 mx-4 md:my-24 md:mx-8 lg:mx-[6.5rem]">
        <div>
            <h1 class="font-title text-4xl md:text-8xl font-semibold">Refonte site e-commerce Shopify</h1>
        </div>
        <section class="flex flex-col md:grid md:grid-cols-3 gap-4 md:grid-flow-row-dense">
            <a href="" class="bg-white rounded-3xl w-full relative md:w-[48%] lg:w-[30%]">
                <img src="assets/undraw_website_setup_re_2p6e.svg" class="w-full h-[16rem] object-cover rounded-t-3xl" alt=""/>
                <h3></h3>

            </a>
        </section>
    </main>

    <footer class="bg-[#1a1b1f] text-white py-8 px-4 md:px-8 lg:px-[6.5rem] lg:flex lg:justify-between">
        <div>
            <p class="uppercase font-semibold mb-2">Portfolio</p>
            <p>Cindy Lionis</p>
        </div>
        <div>
            <p class="uppercase font-semibold mb-2">Localisation</p>
            <p>Lorient</p>
        </div>
        <div>
            <p class="uppercase font-semibold mb-2">Restons en contact</p>
            <div class="flex gap-8">
                <a href="https://www.linkedin.com/in/cindy-lionis-940005174" target="_blank" class="flex items-center gap-2">
                    <i class="fa-brands fa-linkedin"></i>
                    LinkedIn
                </a>
                <a href="mailto:cindy.lionis@gmail.com" class="flex items-center gap-2">
                    <i class="fa-solid fa-envelope"></i>
                    E-mail
                </a>
            </div>
        </div>

    </footer>
    <script>
        const menuButton = document.querySelector('[data-menu-button]');
        const mainMenu = document.querySelector('#main-menu');

        menuButton.addEventListener('click', () => {
            const isOpen = menuButton.getAttribute('aria-expanded') === 'true';
            menuButton.setAttribute('aria-expanded', String(!isOpen));
            menuButton.setAttribute('aria-label', isOpen ? 'Ouvrir le menu' : 'Fermer le menu');
            mainMenu.classList.toggle('hidden', isOpen);
            menuButton.classList.toggle('is-open', !isOpen);
        });

        mainMenu.querySelectorAll('a').forEach((link) => {
            link.addEventListener('click', () => {
                menuButton.setAttribute('aria-expanded', 'false');
                menuButton.setAttribute('aria-label', 'Ouvrir le menu');
                mainMenu.classList.add('hidden');
                menuButton.classList.remove('is-open');
            });
        });
    </script>
</body>
</html>
